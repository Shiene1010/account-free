      const scores = {};

        Object.entries(q[choice].weights).forEach(([agentId, pt]) => {

            <div class="flex justify-center items-center gap-2">
              <span class="px-2.5 py-1 rounded-md bg-[#b8ff00] text-black text-xs font-black">계급: [${data.badge}]</span>
              <span class="px-2.5 py-1 rounded-md bg-zinc-800 text-cyan-300 text-xs font-black border border-zinc-700">${data.mbti}</span>
            </div>

            <div class="relative mx-auto w-32 h-32 flex items-center justify-center">
              <div class="w-28 h-28 ${avatar.bg} neo-box flex flex-col items-center justify-center relative rounded-xl rotate-[-2deg]">
                <span class="text-5xl leading-none select-none">${avatar.emoji}</span>
                <span class="absolute -bottom-2 -right-2 text-3xl bg-zinc-900 rounded-full p-1 border-2 border-black shadow-md">${avatar.sub}</span>
                <span class="mt-2 px-1.5 py-0.5 bg-black text-[#b8ff00] text-[9px] font-black tracking-wider uppercase rounded">${avatar.label}</span>
              </div>
            </div>

            <h1 class="text-xl font-black text-white leading-snug break-keep">${data.title}</h1>
          </section>

          <!-- 2. 긴급 팩폭 진단서 -->
          <section class="bg-red-950/40 border-2 border-red-500/70 rounded-2xl p-4 space-y-2">
            <div class="text-red-400 text-xs font-black">⚠️ 긴급 팩폭 진단서</div>
            <p class="text-sm text-zinc-100 leading-relaxed break-keep font-medium">“${data.roast_comment}”</p>
          </section>

          <!-- 3. 엔트로피 게이지 -->
          <section class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 space-y-3">
            <div class="flex justify-between items-center text-xs font-extrabold">
              <span class="text-amber-300">⚡ 현재 디지털 엔트로피(무질서도)</span>
              <span class="text-red-400">위험 (94%)</span>
            </div>
            <div class="w-full h-2.5 bg-zinc-800 rounded-full overflow-hidden">
              <div class="h-full w-[94%] bg-gradient-to-r from-amber-400 to-red-500"></div>
            </div>
            <p class="text-xs text-zinc-300 leading-relaxed break-keep">${data.digital_status}</p>
          </section>

          <!-- 4. 처방전 & 체크리스트 -->
          <section class="bg-zinc-900 border-2 border-cyan-400/60 rounded-2xl p-4 space-y-4">
            <div class="text-cyan-300 text-sm font-black">🛡️ 맞춤형 디지털 독립 처방전</div>
            <p class="text-xs text-zinc-200 leading-relaxed bg-zinc-950 p-3 rounded-xl border border-zinc-800 break-keep">${data.prescription}</p>

            <div class="space-y-2">
              <p class="text-[11px] font-bold text-zinc-400">👇 오늘 밤 침대 위에서 바로 체크해 보기</p>
              ${CHECKLIST_ITEMS.map(item => {
                const done = !!state.checked[item.id];
                return `
                  <button onclick="toggleCheck('${item.id}')" class="w-full text-left p-3 rounded-xl border text-xs font-bold flex items-start gap-2.5 transition cursor-pointer ${done ? "bg-[#b8ff00]/15 border-[#b8ff00] text-[#b8ff00]" : "bg-zinc-950 border-zinc-800 text-zinc-300"}">
                    <span class="shrink-0">${done ? "✅" : "⬜"}</span>
                    <span class="${done ? "line-through opacity-80" : ""}">${item.label}</span>
                  </button>
                `;
              }).join("")}
            </div>
          </section>

          <!-- 5. 추천 수험생 실속 혜택 -->
          <section class="space-y-3">
            <div class="text-[#b8ff00] text-sm font-black">🎁 이 유형이 지금 당장 챙겨야 할 실속 혜택</div>
            <div class="space-y-2.5">
              ${promos.map(p => `
                <a href="${p.url}" target="_blank" rel="noopener noreferrer" class="block bg-zinc-900 hover:bg-zinc-800/80 border border-zinc-700 rounded-xl p-3.5 transition">
                  <div class="flex justify-between items-start gap-2">
                    <div class="space-y-1">
                      <span class="inline-block text-[10px] font-black px-2 py-0.5 rounded bg-zinc-800 text-pink-400">${p.category} · ${p.org}</span>
                      <h3 class="text-sm font-extrabold text-white">${p.title}</h3>
                      <p class="text-xs font-bold text-[#b8ff00]">${p.cta} →</p>
                    </div>
                    <span class="text-zinc-500 text-xs">↗</span>
                  </div>
                </a>
              `).join("")}
            </div>
          </section>

          <!-- 6. 공유 & 스토리 저장 & 다시하기 -->
          <section class="space-y-2.5 pt-2">
            <button id="share-btn" onclick="shareResult()" class="w-full py-4 bg-[#b8ff00] text-black font-black text-sm rounded-xl neo-box neo-btn flex items-center justify-center gap-2 cursor-pointer">
              📤 단톡방에 내 결과 투척하고 친구 팩폭하기
            </button>
            <button onclick="exportStoryCard()" class="w-full py-3.5 bg-pink-500 text-white font-black text-sm rounded-xl neo-box neo-btn flex items-center justify-center gap-2 cursor-pointer">
              📸 인스타 스토리용 9:16 이미지 저장
            </button>
            <button onclick="restartTest()" class="w-full py-3.5 bg-zinc-900 text-zinc-300 font-bold text-xs rounded-xl border border-zinc-700 cursor-pointer">
              🔄 테스트 처음부터 다시 하기
            </button>
          </section>

          <!-- 7. 실시간 면책형 도파민 광장 -->
          <section class="pt-4 border-t-2 border-dashed border-zinc-800 space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="text-base font-black text-white">🔥 실시간 면책형 도파민 광장</h2>
              <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-zinc-800 text-[#b8ff00]">로컬 체험 모드</span>
            </div>

            <div class="bg-zinc-950 border border-zinc-800 rounded-xl p-3 text-[11px] text-zinc-400 leading-snug">
              🔒 본 광장은 <strong class="text-zinc-200">IP 및 개인 로그를 수집하지 않으며</strong>, 한 번 박제된 드립은 <strong class="text-pink-400">수정/삭제가 불가능</strong>합니다.
            </div>

            <div class="bg-gradient-to-b from-zinc-900 to-zinc-950 border-2 border-amber-400/70 rounded-2xl p-3.5 space-y-2.5">
              <div class="text-xs font-black text-amber-300">🏆 실시간 킹받는 드립 TOP 3 배틀</div>
              <div class="space-y-2">
                ${top3.map((item, idx) => `
                  <div class="bg-zinc-900/90 border border-zinc-800 rounded-xl p-2.5 flex items-center justify-between gap-2">
                    <div class="min-w-0 space-y-1">
                      <div class="flex items-center gap-1.5">
                        <span class="text-xs font-black text-amber-300">#${idx + 1}</span>
                        <span class="text-[10px] font-black px-1.5 py-0.5 rounded bg-[#b8ff00] text-black">${escapeHtml(item.badge)}</span>
                      </div>
                      <p class="text-xs text-zinc-100 font-medium break-all">${escapeHtml(item.content)}</p>
                    </div>
                    <button onclick="likeComment('${item.id}')" class="shrink-0 px-2.5 py-1.5 rounded-lg text-xs font-black border cursor-pointer ${state.likedIds[item.id] ? "bg-pink-500/20 border-pink-400 text-pink-300" : "bg-zinc-950 border-zinc-700 text-zinc-300"}">
                      👍 ${item.likes}
                    </button>
                  </div>
                `).join("")}
              </div>
            </div>

            <form onsubmit="submitComment(event)" class="space-y-2">
              <div class="flex items-center gap-1.5 text-[11px] text-zinc-400">
                <span>내 강제 배지:</span>
                <span class="px-1.5 py-0.5 rounded bg-[#b8ff00] text-black font-black text-[10px]">[${data.badge}]</span>
              </div>
              <div class="flex gap-2">
                <input id="plaza-input" type="text" maxlength="120" ${state.cooldown ? "disabled" : ""} placeholder="${state.cooldown ? "도배 방지 3초 대기 중..." : "아무 드립이나 갈겨보세요 (최대 120자)"}" class="flex-1 bg-zinc-950 border-2 border-zinc-700 focus:border-[#b8ff00] outline-none rounded-xl px-3 py-2.5 text-xs text-white placeholder:text-zinc-500" />
                <button type="submit" ${state.cooldown ? "disabled" : ""} class="px-4 bg-[#b8ff00] text-black font-black text-xs rounded-xl neo-box neo-btn disabled:opacity-40 cursor-pointer shrink-0">박제</button>
              </div>
            </form>

            <div class="space-y-2 max-h-72 overflow-y-auto pr-1">
              ${state.comments.map(item => `
                <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-3 flex items-start justify-between gap-2">
                  <div class="space-y-1 min-w-0">
                    <span class="inline-block text-[10px] font-black px-1.5 py-0.5 rounded bg-zinc-800 text-[#b8ff00]">[${escapeHtml(item.badge)}]</span>
                    <p class="text-xs text-zinc-200 leading-relaxed break-all">${escapeHtml(item.content)}</p>
                  </div>
                  <button onclick="likeComment('${item.id}')" class="shrink-0 px-2 py-1 rounded-lg text-[11px] font-bold border cursor-pointer ${state.likedIds[item.id] ? "bg-pink-500/20 border-pink-400 text-pink-300" : "bg-zinc-950 border-zinc-800 text-zinc-400"}">
                    👍 ${item.likes}
                  </button>
                </div>
              `).join("")}
            </div>
          </section>
        </div>
      `;
    }

    // ==========================================
    // 4. 인터랙션 핸들러
    // ==========================================
    window.startQuiz = function () {
      state.phase = "quiz";
      state.currentIdx = 0;
      state.answers = [];
      state.isLocked = false;
      render();
    };

    window.selectAnswer = function (choice) {
      if (state.isLocked) return;
      state.isLocked = true;

      document.querySelectorAll(".quiz-btn").forEach((b) => (b.disabled = true));
      const q = QUESTIONS[state.currentIdx];
      const popup = q[choice].popup;
      state.answers.push(choice);

      const slot = document.getElementById("popup-slot");
      if (slot) {
        const badgeCls = SPEAKER_STYLES[popup.speaker] || "bg-white text-black";
        slot.innerHTML = `
          <div class="animate-pop absolute inset-x-4 bottom-40 z-30 bg-zinc-950 border-2 border-[#b8ff00] rounded-2xl p-4 shadow-[0_10px_35px_rgba(184,255,0,0.3)]">
            <div class="flex items-start gap-3">
              <span class="shrink-0 px-2.5 py-1 rounded-lg text-xs font-black ${badgeCls}">${popup.speaker}</span>
              <p class="text-sm font-bold text-white leading-snug break-keep">“${popup.text}”</p>
            </div>
          </div>
        `;
      }

      setTimeout(() => {
        state.isLocked = false;
        if (state.currentIdx + 1 < QUESTIONS.length) {
          state.currentIdx += 1;
          render();
        } else {
          state.phase = "analyzing";
          state.resultId = calculateWinner(state.answers);
          state.participants += 1;
          localStorage.setItem("gyeong_participants", String(state.participants));
          render();

          setTimeout(() => {
            state.phase = "result";
            state.checked = {};
            render();
            window.scrollTo({ top: 0, behavior: "instant" });
          }, 1400);
        }
      }, 950);
    };

    window.toggleCheck = function (id) {
      state.checked[id] = !state.checked[id];
      renderResult();
    };

    window.restartTest = function () {
      state.phase = "intro";
      render();
      window.scrollTo({ top: 0, behavior: "instant" });
    };

    window.shareResult = async function () {
      const data = RESULTS[state.resultId] || RESULTS.agent_1;
      const text = `나 '${data.title}' 나옴ㅋㅋㅋ 너도 엄마 폰 기생 중인지 테스트해 봐 👉 ${window.location.href}`;

      if (navigator.share) {
        try {
          await navigator.share({ title: "계정독립만세 팩폭 진단 결과", text, url: window.location.href });
          return;
        } catch {}
      }

      try {
        await navigator.clipboard.writeText(text);
        const btn = document.getElementById("share-btn");
        if (btn) {
          btn.textContent = "✅ 단톡방 투척 멘트 복사 완료! 붙여넣기 하세요";
          setTimeout(() => {
            btn.textContent = "📤 단톡방에 내 결과 투척하고 친구 팩폭하기";
          }, 2000);
        }
      } catch {
        alert(text);
      }
    };

    window.submitComment = function (e) {
      e.preventDefault();
      if (state.cooldown) return;
      const input = document.getElementById("plaza-input");
      const content = (input?.value || "").trim();
      if (!content) return;

      const data = RESULTS[state.resultId] || RESULTS.agent_1;
      state.comments.unshift({
        id: "local-" + Date.now(),
        badge: data.badge,
        content,
        likes: 0
      });
      localStorage.setItem("gyeong_plaza_comments", JSON.stringify(state.comments));

      state.cooldown = true;
      renderResult();
      setTimeout(() => {
        state.cooldown = false;
        if (state.phase === "result") renderResult();
      }, 3000);
    };

    window.likeComment = function (id) {
      if (state.likedIds[id]) return;
      state.likedIds[id] = true;
      state.comments = state.comments.map((c) => (c.id === id ? { ...c, likes: c.likes + 1 } : c));
      localStorage.setItem("gyeong_plaza_comments", JSON.stringify(state.comments));
      localStorage.setItem("gyeong_plaza_likes", JSON.stringify(state.likedIds));
      renderResult();
    };

    // ==========================================
    // 5. 순수 Canvas 9:16 인스타 스토리 카드 생성기
    // ==========================================
    function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight) {
      let line = "";
      let curY = y;
      for (let i = 0; i < text.length; i++) {
        const testLine = line + text[i];
        if (ctx.measureText(testLine).width > maxWidth && i > 0) {
          ctx.fillText(line, x, curY);
          line = text[i];
          curY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, curY);
      return curY + lineHeight;
    }

    window.exportStoryCard = function () {
      const data = RESULTS[state.resultId] || RESULTS.agent_1;
      const canvas = document.createElement("canvas");
      canvas.width = 720;
      canvas.height = 1280;
      const ctx = canvas.getContext("2d");

      // 배경 & 네온 테두리
      ctx.fillStyle = "#09090b";
      ctx.fillRect(0, 0, 720, 1280);
      ctx.strokeStyle = "#b8ff00";
      ctx.lineWidth = 16;
      ctx.strokeRect(8, 8, 704, 1264);

      // 상단 배지
      ctx.fillStyle = "#b8ff00";
      ctx.fillRect(48, 64, 240, 54);
      ctx.fillStyle = "#09090b";
      ctx.font = "900 26px sans-serif";
      ctx.fillText(`계급: [${data.badge}]`, 66, 100);

      ctx.fillStyle = "#27272a";
      ctx.fillRect(306, 64, 130, 54);
      ctx.fillStyle = "#67e8f9";
      ctx.fillText(data.mbti, 336, 100);

      // 진단 타이틀
      ctx.fillStyle = "#ffffff";
      ctx.font = "900 44px sans-serif";
      let nextY = drawWrappedText(ctx, data.title, 48, 195, 624, 62);

      // 팩폭 박스
      const boxTop = nextY + 26;
      ctx.fillStyle = "#18181b";
      ctx.fillRect(48, boxTop, 624, 430);
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 4;
      ctx.strokeRect(48, boxTop, 624, 430);

      ctx.fillStyle = "#f87171";
      ctx.font = "900 24px sans-serif";
      ctx.fillText("🚨 긴급 팩폭 진단서", 78, boxTop + 52);

      ctx.fillStyle = "#e4e4e7";
      ctx.font = "600 28px sans-serif";
      drawWrappedText(ctx, `“${data.roast_comment}”`, 78, boxTop + 112, 564, 44);

      // 하단 브랜딩
      ctx.strokeStyle = "#3f3f46";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(48, 1130);
      ctx.lineTo(672, 1130);
      ctx.stroke();

      ctx.fillStyle = "#a1a1aa";
      ctx.font = "700 22px sans-serif";
      ctx.fillText("수능 끝난 고3 필수 코스", 48, 1175);

      ctx.fillStyle = "#b8ff00";
      ctx.font = "900 38px sans-serif";
      ctx.fillText("계정독립만세", 48, 1222);

      ctx.fillStyle = "#f472b6";
      ctx.font = "800 24px sans-serif";
      ctx.fillText("엄마폰 탈출 기원 🎟️", 455, 1215);

      const dataUrl = canvas.toDataURL("image/png");
      document.getElementById("story-preview-img").src = dataUrl;
      const dl = document.getElementById("story-download-link");
      dl.href = dataUrl;
      dl.download = `계정독립만세_${data.badge}.png`;
      document.getElementById("story-modal").classList.remove("hidden");
    };

    window.closeStoryModal = function () {
      document.getElementById("story-modal").classList.add("hidden");
    };

    // 초기 실행
    render();
  </script>
</body>
</html>
